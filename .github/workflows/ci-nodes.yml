name: node ci

on:
  push:
    branches: [ main ]

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

     - name: Checkout
       uses: actions/checkout@v7.0.1

     - uses: actions/setup-node@v7
       with:
         node-version: 20

     - name: download
       run: npm install

     - name: coverage
       run: npm test -- --coverage

     - name: Upload test results
       uses: actions/upload-artifact@v7
       with:
         name: test-results
         path: |
           junit.xml
           coverage/
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: download
        run: npm install
      
      
      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Security audit
        run: npm audit --audit-level=high

